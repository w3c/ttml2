name: Build and deploy
on: 
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Install Saxon (libsaxonb-java v9)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsaxonb-java
      - name: run sed for .esc
        working-directory: ./spec
        run: |
          find . -type f -name '*.xml' -exec sh -c 'sed -f escape.sed "$0" > "$0.esc"' {} \;
      - name: build spec with saxon and copy assets
        working-directory: ./spec
        run: |
          mkdir -p build/images/
          mkdir -p build/rnc/
          mkdir -p build/xsd/
          saxonb-xslt -s:ttml2.xml -xsl:xmlspec-ttml2.xsl -o:build/index.html
          cp -a images/*.png build/images/
          cp -a images/*.svg build/images/
          cp ttml2-changes.html build/ttml2-changes.html
          cp ttml2-errata.html build/ttml2-errata.html
          zip -j build/rnc/schema.zip rnc/*.rnc
          zip -j build/xsd/schema.zip xsd/*.xsd
      - name: git push
        working-directory: ./spec/build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp -a ../../.git ./
          git symbolic-ref HEAD refs/heads/gh-pages
          git fetch origin gh-pages && git reset origin/gh-pages
          git remote set-url origin "https://github-actions:${GITHUB_TOKEN}@github.com/${{ github.repository }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A pr-preview-files/*
          git commit -m "Deploy PR preview build for ${GH_FHEAD}"
          git push --set-upstream origin gh-pages
